data:
  folder: configs/delhi/data
  file_pattern: '**/*.csv'
  datetime_col: Timestamp
  sort_col: Timestamp
  columns:
  - "PM2.5 (\xB5g/m\xB3)"
  - "NO2 (\xB5g/m\xB3)"
  - RH (%)
  - WS (m/s)
  normalization: zscore
  station_id_col: station_id
  target_station_id: '124'
  input_station_ids:
  - '5024'
  - '1421'
  - '1426'
  station_history_lags: 1
  train_years:
  - '2019'
  - '2020'
  - '2021'
  - '2022'
  - '2023'
  train_periods:
  - start: '2019'
    end: '2023'
  target_pollutant: "NO2 (\xB5g/m\xB3)"
  impute_columns:
  - "PM2.5 (\xB5g/m\xB3)"
  - "NO2 (\xB5g/m\xB3)"
  missing_value_strategy: drop
  drop_missing_values: false
  imputation_top_k: 3
  rebuild_cache: false
  allow_target_history: false
  target_history_lags: 1
  time_features:
    enabled: false
    attributes:
    - month
    - day
    - day_of_week
    - hour
  validation_periods:
  - start: '2024'
    end: '2024'
  testing_periods:
  - start: '2025'
    end: '2025'
  test_time_steps: null
  imputation_plot_period:
  - start: '2024-01-01'
    end: '2024-01-07'
  imputation_plot_station_layout: combined
model:
  datetime_col: Timestamp
  algorithm: src.lstm_regressor.LocalLSTMRegressor
  params:
    verbose: 1
    timesteps: 1
    lstm_units:
    - 64
    - 32
    bidirectional: true
    dropout: 0.1
    dense_units: 32
    learning_rate: 0.001
    batch_size: 64
    epochs: 80
    validation_split: 0.1
    patience: 10
    random_state: 42
    fallback_on_missing_backend: false
  algorithm_name: BiLSTM (NO2)
  validation:
    algorithm: random_search
    metric: RMSE
    max_trials: 5
    random_state: 42
    param_grid:
      random_state:
      - 42
      - 50
      - 100
      lstm_units:
      - - 64
        - 32
      - - 32
      dropout:
      - 0.1
      - 0.2
      batch_size:
      - 32
      - 64
      learning_rate:
      - 0.001
      - 0.0005
  target: "NO2 (\xB5g/m\xB3)"
artifacts:
  dir: configs/delhi/artifacts
  dump_training_data: true
  generate_training_loss_plot: false
  save_training_normalization: true
eval:
  horizon: 0
  store_details: true
  use_training_normalization: true
  separate_validation_period_results: true
  only_separate_validation_period_results: false
  attribution:
    method: auto
    params:
      n_repeats: 5
      random_state: 42
  prediction_plot_period:
  - start: '2025-01-01'
    end: '2025-01-07'
  generate_prediction_plot_files: false
plot:
  title_templates:
    prediction_static: 'Prediction vs Actual ({target})

      {algorithm} | Station {station_id}'
    scatter_static: 'Actual vs Predicted - {target}

      {algorithm} | Station {station_id}'
    baseline_scatter_static: 'Actual vs Predicted - {target}

      {algorithm} | Station {station_id}'
    metrics_by_period: Metrics by Period - Station {station_id} - {pollutant}
    metrics_by_station: 'Metrics by Station - {pollutant} - {period_name}

      {period_start} to {period_end}'
  metrics_graph:
    metrics:
    - RMSE
    - R2
    group_output_by: pollutant
    comparison_mode: stations
