# Shared baseline for Delhi Extra Trees experiments.
#
# Usage pattern:
# - Keep Extra Trees-specific settings here.
# - In station-specific child configs, extend this file and override only station ids.

extends: ../../delhi_base.yaml

model:
  algorithm: extra_trees  # Override only the algorithm for this variant.
  params:
    n_estimators: 500
    max_depth: 20
    min_samples_split: 6
    min_samples_leaf: 2
    max_features: sqrt
    n_jobs: -1
    random_state: 42
    verbose: 1
  validation:
    algorithm: random_search
    metric: RMSE
    max_trials: 5
    random_state: 42
    param_grid:
      random_state: [42, 50, 100]
      n_estimators: [300, 500, 800]
      max_depth: [12, 20, 30]
      min_samples_split: [4, 6, 10]
      min_samples_leaf: [1, 2, 4]
      max_features: [sqrt, log2, 0.8]
